<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="./assets/css/styles.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px; box-sizing: border-box; }
  .card {
    max-width: 600px; padding: 60px 48px;
    background: var(--bg-tint); border-left: 3px solid var(--accent);
    border-radius: 2px; text-align: left;
  }
  .label { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.28em; font-size: 14px; color: var(--accent); }
  .title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 350; font-size: 48px; line-height: 1.1; margin-top: 20px; color: var(--cream); }
  .body { font-family: 'Inter Tight', sans-serif; font-size: 16px; line-height: 1.6; margin-top: 24px; color: var(--cream-dim); }
  .meta { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.22em; font-size: 11px; color: var(--cream-dim); margin-top: 32px; }
  a { color: var(--cream); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Post-race · Coming Soon</div>
  <div class="title">The chequered flag drops here.</div>
  <div class="body">
    Once a race finishes, this page will carry the post-race infographic:
    podium, penalties, updated standings, and the editorial read on what
    just happened. Template still in design — the pre-race version is
    <a href="./pre-race.html">live now</a>.
  </div>
  <div class="meta">F1 Race Week</div>
</div>
