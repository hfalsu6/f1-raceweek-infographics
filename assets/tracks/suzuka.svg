<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER: stylized Suzuka silhouette.

  Replace with the real layout from julesr0y/f1-circuits-svg:
    curl -sL -o assets/tracks/suzuka.svg \
      "https://raw.githubusercontent.com/julesr0y/f1-circuits-svg/main/circuits/suzuka.svg"

  Then run scripts/normalize-track-svg.sh suzuka.svg to set stroke=currentColor.

  Source license: CC BY-SA 4.0 — credit julesr0y/f1-circuits-svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Figure-eight loop — Suzuka's signature crossover layout -->
  <path d="
    M 120 200
    C 100 240, 130 280, 180 280
    C 230 280, 260 250, 280 220
    L 320 170
    C 340 140, 360 130, 390 140
    C 420 150, 430 175, 430 200
    C 430 225, 410 245, 380 245
    C 350 245, 330 225, 320 200
    C 310 175, 290 165, 260 175
    L 220 195
    C 190 205, 160 200, 140 180
    C 120 160, 110 130, 130 110
    C 150 90, 190 90, 220 105
    L 280 135
    C 320 155, 360 155, 400 140
    C 440 125, 480 110, 510 130
    C 540 150, 540 190, 510 215
    L 480 240
  " opacity="0.95"/>
  <!-- Sector ticks -->
  <circle cx="180" cy="280" r="5" fill="currentColor" stroke="none"/>
  <circle cx="430" cy="200" r="5" fill="currentColor" stroke="none"/>
  <circle cx="220" cy="105" r="5" fill="currentColor" stroke="none"/>
  <!-- Start/finish line -->
  <line x1="115" y1="190" x2="115" y2="220" stroke="currentColor" stroke-width="3"/>
  <text x="55" y="215" fill="currentColor" stroke="none" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">START</text>
</svg>
